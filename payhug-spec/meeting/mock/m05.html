<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>M05 — 1원 인증번호 입력 (정산 계좌 / 입금계좌)</title>
<link rel="stylesheet" href="mock.css">
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body>
<div id="scr">

  <div class="gnb">
    <div class="logo"><span class="mark">P</span><span class="m">Pay</span><span class="h">hug</span></div>
    <div class="ham"><i></i><i></i><i></i></div>
  </div>

  <div class="prog"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>

  <div class="wrap">
    <div class="card">

      <div class="h1">1원 인증번호를 입력해주세요</div>
      <div class="sub">통장에 입금된 1원의 <span class="em">적요(메모)에서 숫자 3자리</span>를 입력해 주세요</div>

      <div class="fld">
        <label>계좌주명</label>
        <div class="inp dis">김보미</div>
      </div>

      <div class="fld">
        <label>은행명</label>
        <div class="inp dis">국민은행</div>
      </div>

      <div class="fld">
        <label>계좌번호</label>
        <div class="inp dis">12345604567890</div>
      </div>

      <div class="fld">
        <label class="b">인증번호 (숫자 3자리)</label>
        <div class="inp code ph">통장 적요의 숫자 3자리</div>
        <div class="help">통장에 <span class="em">&quot;페이허XXX&quot;</span> 형태로 입금된 메모에서 숫자만 입력해주세요</div>
      </div>

      <div class="btn pri-off" style="margin-top:34px">인증번호 확인</div>
      <div class="btn ghost">다시 인증 요청하기</div>

    </div>
  </div>

  <div class="note-src">코드 기반 재현 · confirm-settlement / verify 단계 (진행 바 5개, 출금 비밀번호·빠른조회 안내 없음)</div>

</div>
</body>
</html>
