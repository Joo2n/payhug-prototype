<title>투자자 어드민 용어 정의서</title>
<style>@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap");

:root{
  --bg:#FAF9F7; --surface:#FFFFFF; --sunk:#F4F2ED;
  --ink:#1B1A17; --mute:#6B6862; --faint:#94908799;
  --rule:#E5E1D9; --rule-hard:#CFC9BD;
  --accent:#2C4470; --accent-soft:#2C447014;
  --wait:#9C6212; --wait-soft:#9C621218;
  --check:#8A3143; --check-soft:#8A314318;
  --ok:#2F6046;
  --shadow:0 1px 2px #1b1a1710, 0 8px 24px #1b1a170a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16161A; --surface:#1D1E23; --sunk:#22242A;
    --ink:#ECEAE5; --mute:#9B978E; --faint:#77736B99;
    --rule:#2E3038; --rule-hard:#3D4048;
    --accent:#93AEE0; --accent-soft:#93AEE01F;
    --wait:#E0A64A; --wait-soft:#E0A64A22;
    --check:#E08594; --check-soft:#E0859422;
    --ok:#6FBF95;
    --shadow:0 1px 2px #00000040, 0 8px 24px #00000030;
  }
}
:root[data-theme="dark"]{
  --bg:#16161A; --surface:#1D1E23; --sunk:#22242A;
  --ink:#ECEAE5; --mute:#9B978E; --faint:#77736B99;
  --rule:#2E3038; --rule-hard:#3D4048;
  --accent:#93AEE0; --accent-soft:#93AEE01F;
  --wait:#E0A64A; --wait-soft:#E0A64A22;
  --check:#E08594; --check-soft:#E0859422;
  --ok:#6FBF95;
  --shadow:0 1px 2px #00000040, 0 8px 24px #00000030;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

/* ── 상단 막대 ───────────────────────────────────── */
.bar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center;
  gap:10px; flex-wrap:wrap; padding:10px 20px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--rule);
}
.bar h1{
  margin:0; font-family:"Noto Serif KR",serif; font-size:16px;
  font-weight:700; letter-spacing:-.01em; white-space:nowrap;
}
.bar .sp{flex:1}
.btn{
  font:inherit; font-size:13px; line-height:1; cursor:pointer;
  padding:8px 12px; border-radius:7px; border:1px solid var(--rule-hard);
  background:var(--surface); color:var(--ink);
}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:600}
.btn.pri:hover{filter:brightness(1.12); color:var(--bg)}
.btn[disabled]{opacity:.45; cursor:default}
.btn[disabled]:hover{border-color:var(--rule-hard); color:var(--ink)}
.bar input[type=search]{
  font:inherit; font-size:13px; padding:7px 11px; width:180px;
  border-radius:7px; border:1px solid var(--rule-hard);
  background:var(--surface); color:var(--ink);
}
.state{font-size:12px; color:var(--mute); white-space:nowrap}
.state.on{color:var(--wait)}
.state.ok{color:var(--ok)}
.state.bad{color:var(--check)}

/* ── 판짜기 ───────────────────────────────────── */
.wrap{display:grid; grid-template-columns:236px minmax(0,1fr); gap:34px;
      max-width:1160px; margin:0 auto; padding:26px 20px 120px}
@media(max-width:900px){.wrap{grid-template-columns:1fr; gap:18px}
  .toc{position:static; max-height:none}}

.toc{position:sticky; top:66px; align-self:start; max-height:calc(100vh - 92px);
     overflow:auto; font-size:12.5px; line-height:1.55}
.toc .grp{margin:14px 0 6px; font-weight:700; font-size:11px; letter-spacing:.09em;
          color:var(--mute); text-transform:uppercase}
.toc a{display:flex; gap:7px; padding:3px 6px; border-radius:5px;
       color:var(--mute); text-decoration:none}
.toc a:hover{background:var(--accent-soft); color:var(--accent)}
.toc a .n{font-variant-numeric:tabular-nums; opacity:.65; min-width:1.5em}
.toc a.wait{color:var(--wait)} .toc a.check{color:var(--check)}

/* ── 머리 ───────────────────────────────────── */
.head{border-bottom:1px solid var(--rule); padding-bottom:20px; margin-bottom:8px}
.head h2{margin:0 0 6px; font-family:"Noto Serif KR",serif; font-size:30px;
         font-weight:700; letter-spacing:-.02em; text-wrap:balance}
.head .sub{color:var(--mute); font-size:13.5px; margin:0 0 16px}
.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
       gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:9px;
       overflow:hidden}
.facts div{background:var(--surface); padding:11px 13px}
.facts dt{font-size:11px; letter-spacing:.06em; color:var(--mute); margin:0 0 3px}
.facts dd{margin:0; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums}

.pend{margin:22px 0 6px; border:1px solid var(--wait); border-radius:9px;
      background:var(--wait-soft); padding:13px 15px}
.pend h3{margin:0 0 8px; font-size:13px; letter-spacing:.04em; color:var(--wait)}
.pend ul{margin:0; padding-left:17px}
.pend li{font-size:13.5px; margin:3px 0}
.pend b{font-weight:600}

.pf{margin:10px 0 0; padding:10px 12px; border-radius:7px; background:var(--surface);
    border:1px solid var(--wait)}
.pf .lb{font-size:11px; letter-spacing:.05em; color:var(--wait); font-weight:700}
.pf .fx{margin-top:5px; font-family:"IBM Plex Mono",ui-monospace,monospace;
        font-size:13px; padding:5px 7px; border-radius:5px; background:var(--sunk)}
.pf .fx:focus{outline:2px solid var(--accent); outline-offset:1px}
.pf .to{margin-top:6px; font-size:12.5px; color:var(--mute)}
.mark{font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--wait);
      margin-left:8px; white-space:nowrap}

/* ── 항목 ───────────────────────────────────── */
.card{background:var(--surface); border:1px solid var(--rule); border-radius:11px;
      margin:16px 0; box-shadow:var(--shadow); scroll-margin-top:72px}
.card.hide{display:none}
.card > .top{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
             padding:14px 17px 0}
.card .no{font-variant-numeric:tabular-nums; font-size:12px; font-weight:700;
          color:var(--mute); letter-spacing:.04em}
.card h3{margin:0; font-family:"Noto Serif KR",serif; font-size:19px; font-weight:700;
         letter-spacing:-.01em}
.card .sym{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px;
           color:var(--accent); background:var(--accent-soft);
           padding:2px 7px; border-radius:5px}
.pill{font-size:11px; font-weight:700; letter-spacing:.05em; padding:3px 8px;
      border-radius:20px; border:1px solid currentColor; cursor:pointer;
      background:none; font-family:inherit; line-height:1.5}
.pill.s확정{color:var(--mute)}
.pill.s대기{color:var(--wait); background:var(--wait-soft)}
.pill.s확인필요{color:var(--check); background:var(--check-soft)}
.card .ops{margin-left:auto; display:flex; gap:3px; opacity:0; transition:opacity .12s}
.card:hover .ops, .card:focus-within .ops{opacity:1}
.ops button{font:inherit; font-size:11px; line-height:1; cursor:pointer; padding:5px 7px;
            border:1px solid var(--rule); border-radius:5px;
            background:var(--surface); color:var(--mute)}
.ops button:hover{color:var(--accent); border-color:var(--accent)}
.ops button.del:hover{color:var(--check); border-color:var(--check)}

blockquote.q{margin:11px 17px 0; padding:11px 14px; background:var(--sunk);
             border-left:3px solid var(--rule-hard); border-radius:0 7px 7px 0;
             font-family:"Noto Serif KR",serif; font-size:14px; line-height:1.7;
             color:var(--ink)}
blockquote.q .tag{display:block; font-family:"Noto Sans KR",sans-serif; font-size:10.5px;
                  letter-spacing:.08em; color:var(--mute); margin-bottom:5px}

.body{padding:4px 17px 16px}
.plain{margin:12px 0 0; font-size:15px; line-height:1.85}
.rows{margin:13px 0 0; display:grid; grid-template-columns:76px minmax(0,1fr);
      gap:1px; background:var(--rule); border:1px solid var(--rule);
      border-radius:8px; overflow:hidden}
.rows .k{background:var(--sunk); padding:8px 11px; font-size:11.5px; font-weight:700;
         color:var(--mute); letter-spacing:.03em; display:flex; align-items:center;
         justify-content:space-between; gap:4px}
.rows .k button{font:inherit; font-size:12px; line-height:1; border:0; background:none;
                cursor:pointer; color:var(--faint); padding:0 2px}
.rows .k button:hover{color:var(--check)}
.rows .v{background:var(--surface); padding:8px 12px; font-size:13.5px; min-width:0;
         overflow-x:auto}
.rows .v.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px;
              white-space:pre-wrap; word-break:break-word}
.rows .v.num{font-variant-numeric:tabular-nums}

[contenteditable]{border-radius:5px; transition:background .12s, box-shadow .12s}
[contenteditable]:hover{background:var(--accent-soft)}
[contenteditable]:focus{outline:none; background:var(--accent-soft);
                        box-shadow:inset 0 0 0 1px var(--accent)}
[contenteditable]:empty::before{content:attr(data-ph); color:var(--faint)}

.addrow{margin-top:8px; display:flex; gap:6px}
.addrow button{font:inherit; font-size:11.5px; cursor:pointer; padding:5px 9px;
               border:1px dashed var(--rule-hard); border-radius:6px;
               background:none; color:var(--mute)}
.addrow button:hover{color:var(--accent); border-color:var(--accent)}

.shots{margin-top:13px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start}
.shots figure{margin:0; width:210px}
.shots img{width:100%; display:block; border:1px solid var(--rule-hard);
           border-radius:7px; cursor:zoom-in; background:var(--sunk)}
.shots figcaption{font-size:11px; color:var(--mute); margin-top:4px}
.golink{display:inline-flex; align-items:center; gap:5px; font-size:12px;
        text-decoration:none; padding:5px 9px; border:1px solid var(--rule-hard);
        border-radius:6px; color:var(--accent)}
.golink:hover{border-color:var(--accent)}

.sep{margin:34px 0 4px; padding-top:22px; border-top:2px solid var(--rule-hard);
     font-family:"Noto Serif KR",serif; font-size:21px; font-weight:700}
.sep span{font-family:"Noto Sans KR",sans-serif; font-size:12px; font-weight:400;
          color:var(--mute); margin-left:9px}
.newitem{margin:16px 0; text-align:center}

/* ── 확대 ───────────────────────────────────── */
.lb{position:fixed; inset:0; z-index:90; background:#0B0B0Dee; display:none}
.lb.on{display:block}
.lb .stage{position:absolute; inset:0; overflow:hidden; cursor:grab}
.lb .stage.drag{cursor:grabbing}
.lb img{position:absolute; top:0; left:0; transform-origin:0 0;
        image-rendering:-webkit-optimize-contrast; user-select:none;
        -webkit-user-drag:none}
.lb .hud{position:absolute; top:0; left:0; right:0; display:flex; gap:8px;
         align-items:center; padding:12px 16px; color:#EFEDE8; font-size:12.5px}
.lb .hud .sp{flex:1}
.lb .hud button{font:inherit; font-size:12.5px; line-height:1; cursor:pointer;
                padding:7px 11px; border-radius:6px; border:1px solid #FFFFFF33;
                background:#FFFFFF14; color:#EFEDE8}
.lb .hud button:hover{background:#FFFFFF26}
.lb .hud .zm{font-variant-numeric:tabular-nums; min-width:52px; text-align:center}

@media print{
  .bar,.toc,.ops,.addrow,.newitem,.golink{display:none!important}
  .wrap{grid-template-columns:1fr; padding:0}
  .card{break-inside:avoid; box-shadow:none}

00원이 투자자가 채권 한 건에서 기대하는 몫이다. 가맹점이 무는 전체 수수료율과 다른 값이다 — 투자자 몫은 그 안의 일부다.","formula":"할인율 = 0.11%","our_value":"0.11%","screen":"투자 자산 > 하단 『수익 산정 기준』 수수료 배분형 『할인율』 (invest-assets.html) · 투자 시뮬레이션 > 기준 변수 『할인율 (%)』 (invest-sim.html)","status":"확인필요","note":"원문이 '0.11% 예정' 이라 적어 확정값이 아니다. 화면·원장은 0.11% 로 채택해 두었다. 3차 미팅에서 대표가 가맹점이 무는 통 요율을 「1%」 라 말한 기록이 있으나, 그 1% 가 계약상 표준요율인지 예시인지는 발화되지 않아 값을 채택하지 않았다. 대표 DM 2026-08-31 14:45 에 「순지급액x(1-0.11)」 로 적힌 자리가 있다. 1 − 0.11 = 0.89 라 99.89% 와 100배 어긋난다. 값이 아니라 표기 문제이고, 정본 표기는 (1 − 0.0011) 이다.","shot":"invest-assets.webp","symbol":null,"href":"https://payhug-investor-demo.vercel.app/invest-assets.html"},{"no":3,"image":1,"term":"순현금","quote":"순현금: 조회시점 현재의 ‘유동화투자자에게 할당된 쿠콘제공 가상계좌’의 현금잔액","plain":"투자자 돈 가운데 채권으로 나가지 않고 계좌에 놀고 있는 현금이다. 쿠콘이 투자자별로 내준 가상계좌의 잔액을 조회 시점에 그대로 읽는다. 채권 원장이 만드는 값이 아니라 계좌에서 받아오는 값이다. 투자실행액과 더하면 투자자산이 된다.","formula":null,"our_value":"20,000,000원","screen":"투자 자산 > 상단 현황 3번째 카드 · 현황 표 『순현금』 행 (invest-assets.html) · 관리 > 쿠콘 관리 현금 (coocon.html)","status":"확정","note":"조회 시점 잔액이라 전일자 자정 잔액인 EC 와 값이 다르다 — 찍는 시각이 다르다.","shot":"coocon.webp","symbol":null,"href":"https://payhug-investor-demo.vercel.app/invest-assets.html"},{"no":4,"image":1,"term":"w금융일수","quote":"w금융일수 = Σ Ai x Di / Σ Ai","plain":"지금 깔려 있는 채권들이 평균 며칠짜리인지다. 단순 평균이 아니라 금액으로 가중한 평균이라 금액이 큰 채권의 날수 쪽으로 끌린다. 채권마다 투자실행금 A_i 를 곱해 날수를 더한 뒤 A_i 합으로 나눈다. 할인율 (1 − r) 은 분자와 분모에 똑같이 곱해져 약분되므로, 순지급액으로 가중해도 값이 같다. 이 값이 작을수록 같은 돈을 1년에 여러 번 굴린다는 뜻이라 ty수익율이 커진다.","formula":"w금융일수 = Σ (A_i × D_i) / Σ A_i","our_value":"3.039607일 (화면 표기 3.04일)","screen":"투자 자산 > 상단 현황 4번째 카드 보조문구 『W금융일수 3.04일 기준』 · 현황 표 『W금융일수』 열 (invest-assets.html)","status":"확정","note":"가중치는 건수가 아니라 플랫폼별 금액 기준이다 (3차 미팅 재확인). 우리 구성비는 금액 실측 카드 42.83% · 배민 43.10% · 쿠팡이츠 9.55% · 요기요 4.51% 에서 나온다. 대표 엑셀 『정산주기.xlsx』 비중 시트의 카드 65% · 2.7504일은 이용자 수(MAU) 유래라 시장 평균 참고값으로만 두었는데, 3차 미팅에서 대표가 같은 값을 금액 구성비라 말해 원천이 갈린다. 어느 쪽 값도 새로 채택하지 않았다.","shot":"invest-assets.webp","symbol":"w","href":"https://payhug-investor-demo.vercel.app/invest-assets.html"},{"no":5,"image":1,"term":"Ai","quote":"Ai = ID가 i인 대상정산금채권의 순지급액 x (1- 유동화투자자의 할인율)","plain":"채권 한 건을 투자자가 산 값이다. 그 채권의 순지급액에서 할인율만큼 깎은 금액이다. 순지급액에 할인율을 곱한 것이 아니라 (1 − 할인율) 을 곱한 것이다. w금융일수의 가중치이자 투자 실행액의 낱개다.","formula":"A_i = 순지급액 × (1 − 할인율)","our_value":"미회수 채권 2,240건의 A_i 합 = 80,000,000원","screen":"투자 자산 > 현황 표 『투자실행액』 행 금액 (A_i 의 합) (invest-assets.html)","status":"확정","note":"「순지급액에서 할인율을 곱한 것」이 아니라 「순지급액 × (1 − 할인율)」이라는 점을 3차 미팅에서 대표가 직접 정정했다. 낱개 A_i 는 화면에 뜨지 않고 합계만 뜬다.","shot":"invest-assets.webp","symbol":"A_i","href":"https://payhug-investor-demo.vercel.app/invest-assets.html"},{"no":6,"image":1,"term":"Di","quote":"Di = ID가 i인 다상정산금채권의 금융일수","plain":"채권 한 건에 투자자 돈이 묶여 있는 날수다. 선정산일에 나가서 정산예정일에 돌아오기까지를 센다. 채권 한 건의 값은 날짜 차이라 정수다. 플랫폼 평균이 소수로 나오는 것은 정수 날수가 섞인 평균이기 때문이다.","formula":"D_i = 정산예정일 − 선정산일","our_value":"1일 ~ 13일","screen":"투자 시뮬레이션 > 정산금채권 입력 『금융일수』 열 (invest-sim.html)","status":"확인필요","note":"원문 표기 그대로 옮김. '다상정산금채권' 은 '대상정산금채권' 의 오기로 보임. 같은 정의서 안에서 대문자 D 가 두 뜻으로 쓰였다 — 단독 D 는 현재일자, 끝에 i 가 붙은 D_i 는 금융일수다. 2026-08-31 기호 규칙이 금융일수를 대문자 D 로 두고 날짜 쪽을 소문자 d 로 내려 둘을 갈랐다. D_i 표기는 그대로다 (기호 규칙 2026-08-31 · dm_0831/symbol_rule_0831.md). 이 방향은 잠정이다 — 대표 DM 은 금융일수 쪽을 다른 글자로 바꾸라 했고 확정 규칙은 날짜 쪽을 소문자 d 로 내렸다. 4차 미팅에서 대표 확인을 받는다.","shot":null,"symbol":"D_i","href":"https://payhug-investor-demo.vercel.app/invest-sim.html"},{"no":7,"image":1,"term":"대상정산금채권","quote":"대상정산금채권: 가맹점ID가 ‘유동화투자자와 정산금채권 재양도 합의서 체결한 가맹점’의 ID이면서, 선정산일자가 상기 합의서상의 효력기간에 해당하는 정산금채권","plain":"이 어드민의 모든 숫자가 세는 대상이다. 두 조건을 함께 만족하는 정산금채권만 든다 — 가맹점이 그 투자자와 재양도 합의서를 맺었을 것, 그리고 그 채권의 선정산일자가 합의서 효력기간 안에 들 것. '회수되지 않은' 이라는 조건은 여기에 붙지 않고 투자 실행액 줄에만 붙는다. 그래서 w금융일수와 S입금부족율은 회수 여부를 가리지 않고 발생 기준으로 센다.","formula":null,"our_value":"61,760건 (발생 기준) · 그 가운데 미회수 2,240건","screen":"투자 자산 > 현황 표 열머리 『W금융일수 · 대상정산금채권 전체 (발생 기준) · 채권 건수 61,760건』 (invest-assets.html) · 계약기록 > 재양도합의서 목록 8건 (contracts.html)","status":"확정","note":"합의서 효력기간의 시작·끝이 무엇인지는 원문에 없다. 계약기록 화면은 합의서 목록만 보이고 효력기간 칸은 없다.","shot":"contracts.webp","symbol":null,"href":"https://payhug-investor-demo.vercel.app/invest-assets.html"},{"no":8,"image":1,"term":"각 정산금채권의 ID","quote":"각 정산금채권의 ID = 가맹점ID & 플랫폼ID & 매출일자(YYYYMMDD)","plain":"채권 한 건을 가리키는 열쇠다. 가맹점 · 플랫폼 · 매출일자 셋을 붙여 만든다. 같은 가맹점이라도 카드사와 배달앱은 다른 채권이고, 같은 플랫폼이라도 매출일이 다르면 다른 채권이다. 산식에서 i 자리에 들어가는 값이 이것이다.","formula":"ID = 가맹점ID & 플랫폼ID & 매출일자(YYYYMMDD)","our_value":"가맹점ID 8개 (M2026-0001 · M2026-0002 · M2026-0004 · M2026-0005 · M2026-0006 · M2026-0007 · M2026-0008 · M2026-0009) × 플랫폼 4종","screen":"가맹점 > 가맹점 목록 『가맹점ID』 열 (merchants.html)","status":"확정","note":"원장은 채권 한 칸을 (가맹점 · 플랫폼 · 금융일수 버킷 · 선정산일) 로 잡는다. 선정산일은 매출일 다음날이라 매출일자 축과 하루 차이로 맞물린다. 금융일수 버킷이 한 축 더 있는 것은 같은 플랫폼 매출도 실제로는 여러 날수로 흩어져 들어오는 것을 재현하기 위한 것이다. 화면에 매출일자 칸은 없다.","shot":"merchants.webp","symbol":"i","href":"https://payhug-investor-demo.vercel.app/merchants.html"},{"no":9,"image":1,"term":"플랫폼ID","quote":"플랫폼ID: 각 카드사, 각 배달플랫폼에 페이허그가 할당한 ID","plain":"돈이 들어오는 통로마다 페이허그가 붙인 번호다. 카드사 각각, 배달플랫폼 각각이 따로 번호를 받는다. 통로마다 돈이 들어오기까지 걸리는 날수가 달라 금융일수가 갈리고, 그래서 채권 ID 에 들어간다.","formula":null,"our_value":"4종 — 카드사 · 배달의민족 · 쿠팡이츠 · 요기요","screen":"투자 시뮬레이션 > 정산금채권 입력 『플랫폼』 열 선택지 (invest-sim.html)","status":"확정","note":"화면에는 플랫폼 이름만 있고 ID 값 칸은 없다. 원장의 플랫폼별 평균 금융일수는 카드사 2.016438일 · 배달의민족 3.350685일 · 쿠팡이츠 4.747945일 · 요기요 6.164384일 (대표 『정산주기.xlsx』 2025년 365일 실측).","shot":null,"symbol":null,"href":"https://payhug-investor-demo.vercel.app/invest-sim.html"},{"no":10,"image":1,"term":"금융일수","quote":"금융일수 = 선정산일로부터 정산예정일까지의 한편넣기 일수 (예, 선정산일 =260827, 정산예정일 = 260808 이면 금융일수 = 1)","plain":"선정산일과 정산예정일 사이의 날수다. '한편넣기' 는 양끝 가운데 한쪽만 세라는 뜻이다. 8월 27일에 나가 8월 28일에 들어오면 1일이다. 이 날수만큼 투자자 돈이 묶인다.","formula":"금융일수 = 정산예정일 − 선정산일","our_value":"1일 ~ 13일","screen":"투자 시뮬레이션 > 정산금채권 입력 『선정산일』·『정산예정일』·『금융일수』 열 (invest-sim.html)","status":"확정","note":"원문 표기 그대로 옮김. 예시의 정산예정일 260808 은 260828 의 오기로 보임 — 260827 에서 1일이 되려면 260828 이어야 한다. 금융일수의 끝점을 어느 날로 잡는지(정산예정일인지 실제 입금일인지)는 원문에 없다.","shot":null,"symbol":"D_i","href":"https://payhug-investor-demo.vercel.app/invest-sim.html"},{"no":11,"image":1,"term":"S입금부족율","quote":"S입금부족율 = Σ SLi / Σ SAi","plain":"플랫폼에서 약속보다 덜 들어온 비율이다. 표본 구간 채권들의 부족액을 전부 더하고, 같은 채권들의 투자실행금을 전부 더한 뒤 한 번 나눈다. 하루하루 비율을 내어 평균하지 않는다. 이 값이 할인율 0.11% 를 넘으면 투자자 몫 수익을 다 먹고도 원금이 모자란다는 뜻이라, 수익성이 아니라 위험을 보는 지표다.","formula":"S입금부족율 = Σ SL_i / Σ SA_i","our_value":"0.074428% (화면 표기 0.07%)","screen":"투자 자산 > 현황 표 『S입금부족율』 열 · 가맹점별 투자자산 표 『S입금부족율』 열 (invest-assets.html)","status":"확인필요","note":"분자·분모를 각각 더한 뒤 한 번 나누는 방식은 3차 미팅에서 대표 구두 예시로 확인됐다 (300만원 분의 3만원 = 1%). 남은 것은 이 한 칸의 표본이 화면 기간 필터를 따라가는지다 — 원문은 d 하나로 고정(d-20 ~ d-11)이고 화면도 고정인데, 3차 미팅에서 대표가 「고른 기간 전체의 입금부족률」로 설명한 대목이 있어 갈린다. 대표 DM 2026-08-31 15:15 은 「모두 표본이 맞고 표본의 합은 S가 빠지고 시그마 i부터 S까지로 통계식으로 된다」 고 적어 우리 표기와 어긋난다. 우리 표기는 Σ SL_i / Σ SA_i 로 기호 앞에 S 를 붙이고, DM 표기는 앞 S 를 떼고 S 를 시그마의 위끝(표본 크기) 자리로 옮긴다. 따라가면 SL_i · SA_i 두 기호가 사라지고 S 항과 Σ 항이 개정된다. 바꾸지 않았다 — 물을 것으로 올렸다.","shot":"invest-assets.webp","symbol":"S","href":"https://payhug-investor-demo.vercel.app/invest-assets.html"},{"no":12,"image":1,"term":"SLi","quote":"SLi = 표본집합에 속하는 ID가 i인 대상정산금채권의 미지급액 – 과지급액","plain":"표본 구간 채권 한 건에서 덜 들어온 금액이다. 미지급액에서 과지급액을 뺀다. 더 들어온 쪽이 크면 음수가 된다. 상환액·투자수익 쪽의 max(0, …) 처럼 0 으로 누르는 장치가 이 줄에는 없다.","formula":"SL_i = 미지급액 − 과지급액","our_value":"표본 3,200건 합 Σ SL_i = 194,170원","screen":null,"status":"확인필요","note":"원문이 SL_i 에 바닥을 걸지 않아 음수가 허용된다. 같은 정의서의 상환액·투자수익은 max(0, 미지급금 − 과지급금) 으로 음수를 막는다. 두 자리가 갈리는 이유가 원문에 없고 3차 미팅에서도 다뤄지지 않았다 — 상환액 쪽 max(0, …) 만 확인됐다. 가운데 글자 L 은 입금부족액 자리에만 쓰인다. 정의서의 미지급금·과지급금은 운영 6대 개념의 같은 이름과 글자만 같고 모집단이 달라 합치지 않는다. 대표 DM 2026-08-31 15:15 는 「L : 입금부족액, (미지급금 - 환급금)」 이라 적었다. 대표 용어 정의 원문과 3차 미팅은 미지급액 − 과지급액이다. 환급과 과지급은 운영 6대 개념 가운데 서로 다른 둘이라 합치지 않는다. 어느 쪽이 맞는지는 판정하지 않았다 — 기호 사전 L 항도 확인필요로 내렸다.","shot":null,"symbol":"SL_i","href":null},{"no":13,"image":1,"term":"표본집합","quote":"표본집합: 선정산일이 D-20부터 D-11인 기간에 속하는 대상정산금채권들의 집합","plain":"S입금부족율을 잴 채권을 고르는 그물이다. 선정산일이 오늘로부터 20일 전부터 11일 전까지인 채권만 든다. 폭이 열흘인 이유는 하루치만 보면 그날만의 사정이 섞이기 때문이다. 11일이라는 여유를 두는 이유는 원문에 적혀 있지 않다.","formula":"표본집합 = { 선정산일 ∈ [d−20, d−11] 인 대상정산금채권 }","our_value":"2026-08-07 ~ 2026-08-16 · 채권 3,200건","screen":"투자 자산 > 현황 표 열머리 『S입금부족율 · 선정산일 d-20 ~ d-11 표본 · 채권 건수 3,200건』 (invest-assets.html)","status":"확인필요","note":"원문은 자르는 축이 선정산일이다. 3차 미팅에서 대표가 구두로 설명한 개념은 정산예정일 축이었다 (「어제 상환 예정일인 것 중에 99%가 들어왔는지」). 원장에서 축을 바꾸면 값이 0.074428% 에서 0.071879% 로 갈린다. 건수는 두 축 모두 3,200건이라 건수로는 구별되지 않는다. 폭 열흘의 근거는 3차 미팅에서 나왔고, 하한 d-11 의 근거는 아직 없다.","shot":"invest-assets.webp","symbol":"S","href":"https://payhug-investor-demo.vercel.app/invest-assets.html"},{"no":14,"image":1,"term":"d","quote":"D = 현재일자","plain":"오늘 날짜다. 표본 구간 d-20 ~ d-11 과 d-1 을 세는 기준점이다. 매출일자도 선정산일도 아니다.","formula":"d = 오늘","our_value":"2026-08-27","screen":"투자 자산 > 제목 옆 『기준일 2026-08-27』 (invest-assets.html)","status":"확인필요","note":"원문 표기는 대문자 D 다. 2026-08-31 기호 규칙이 대문자 D 를 금융일수, 소문자 d 를 오늘 날짜로 갈랐다 (기호 규칙 2026-08-31 · dm_0831/symbol_rule_0831.md). 대표 DM 2026-08-31 15:15 도 이미 「SD(d-1)」 로 소문자를 썼다. d-1 이 붙은 기호는 어제 날짜가 아니라 정산예정일이 어제인 대상정산금채권 집합을 가리킨다 — 대표 DM 같은 글 「D-1은 오늘일자 -1 일자인데 이게 들어가면 무조건 어제자가 상환예정일인 값들에 대해서 뭔가 계산한다고 논리를 설정해야 함」. 이 방향은 잠정이다 — 대표 DM 은 금융일수 쪽을 다른 글자로 바꾸라 했고 확정 규칙은 날짜 쪽을 소문자 d 로 내렸다. 4차 미팅에서 대표 확인을 받는다.","shot":"invest-assets.webp","symbol":"d","href":"https://payhug-investor-demo.vercel.app/invest-assets.html"},{"no":15,"image":1,"term":"SAi","quote":"SAi = 표본집합에 속하는 ID가 i인 대상정산급채권의 순지급액 x (1- 유동화투자자의 할인율)","plain":"표본 구간 채권 한 건을 투자자가 산 값이다. 계산식은 A_i 와 똑같고 대상 범위만 표본집합으로 좁힌 것이다. S입금부족율의 분모를 이룬다.","formula":"SA_i = 순지급액 × (1 − 할인율)","our_value":"표본 3,200건 합 Σ SA_i = 260,881,264원","screen":null,"status":"확인필요","note":"원문 표기 그대로 옮김. '대상정산급채권' 은 '대상정산금채권' 의 오기로 보임. SA_i 와 SA_{d-1} 을 같은 것으로 보면 안 된다 — SA_i 는 표본 채권 1건분, SA_{d-1} 은 전일자 도래분 하루치 합계다. 대표 DM 2026-08-31 15:37 은 「투자실행액 : SAi」 · 「PSA는 기간 합계」 라 적어 SA_i 를 투자실행액 자리에 세웠다. 같은 글은 DM 표기 「SA(D-1)」 을 정산예정일이 전일자인 대상정산금채권 하루치 몫이라 풀었다. 원문에서 SA_i 는 표본집합에 속하는 채권 1건분이고 투자 실행액은 미회수 채권의 A_i 합이라 서로 어긋난다. 어느 쪽이 맞는지는 판정하지 않았다.","shot":null,"symbol":"SA_i","href":null},{"no":16,"image":1,"term":"ty수익율","quote":"ty수익율 = 유동화투자자의 할인율 x (365 / w금융일수)","plain":"지금 굴리는 방식대로 1년을 굴리면 몇 % 가 되는지다. 채권 한 바퀴에서 얻는 폭이 할인율 0.11% 이고, 그 바퀴를 1년에 몇 번 도는지가 365 ÷ w금융일수다. 둘을 곱한다. w금융일수가 짧을수록 회전이 빨라 값이 커진다. 이 자리의 값은 부족액을 빼기 전이라 계약대로 다 들어온다고 본 예상치다.","formula":"ty수익율 = 할인율 × (365 / w금융일수)","our_value":"13.21%","screen":"투자 자산 > 상단 현황 4번째 카드 · 현황 표 『Ty수익율』 열 · 가맹점별 투자자산 표 『Ty수익율』 열 (invest-assets.html)","status":"확정","note":"투자 자산 메뉴 최상단 값은 예상치, 투자 수익 메뉴 일별 표의 값은 실적치다 (3차 미팅 확정). 전체 ty수익율은 가맹점 행별로 평균 내지 않고 전체를 더한 뒤 가중평균한다 — 행별 평균은 13.86%, 전체 가중평균은 13.21% 로 갈린다. 행별 평균이 더 크게 나오는 것은 1/w 이 아래로 볼록해 생기는 차이다 (Jensen 부등식). 대표 DM 2026-08-31 16:27 — 「365를 w 금융일수로 나누면 1년동안 몇 번 굴릴 수 있는가 => 여기에 수익률(할인율) 곱하면 이게 ty 수익률이다」. 같은 글이 ty수익률을 연 환산과 일 환산 두 갈래로 적었다. 대표 DM 같은 날 16:45 — 「ty수익률이 위는 할인율, 아래는 투자수익률 smr인 이유는 위는 예상치 아래는 실제 결과치라서 실제로 얻은 수익률(할인율)을 나타내는 것」. 16:45 의 항등식은 근사식이라 분모를 투자실행액으로 볼 때 0.11%, 원식대로 순지급액 × (1 − 할인율) 로 볼 때 0.110121% 로 갈린다 — 27항에 적었다.","shot":"invest-assets.webp","symbol":"Ty / ty","href":"https://payhug-investor-demo.vercel.app/invest-assets.html"},{"no":17,"image":1,"term":"비중","quote":"비중","plain":"투자자산을 투자실행액과 순현금 둘로 가른 몫이다. 아래 두 줄로 나뉘어 이어진다.","formula":null,"our_value":"투자실행액 80.0% · 순현금 20.0% · 합 100.0%","screen":"투자 자산 > 현황 표 『비중』 열 (invest-assets.html)","status":"확정","note":"원문에 이 줄만 있고 정의문이 없다. 아래 두 줄이 실제 정의다.","shot":"invest-assets.webp","symbol":null,"href":"https://payhug-investor-demo.vercel.app/invest-assets.html"},{"no":18,"image":1,"term":"투자 실행액의 비중","quote":"투자 실행액의 비중 = 투자실행액 / (투자실행액 + 순현금)","plain":"투자자 돈 가운데 채권으로 나가 있는 몫이다. 분모는 투자실행액과 순현금을 더한 투자자산이다. 이 값이 낮을수록 놀고 있는 돈이 많다는 뜻이다.","formula":"투자 실행액의 비중 = 투자실행액 / (투자실행액 + 순현금)","our_value":"80.0%","screen":"투자 자산 > 현황 표 『투자실행액』 행 『비중』 칸 · 상단 현황 2번째 카드 보조문구 『비중 80.0% · 보관 ㈜페이허그』 (invest-assets.html)","status":"확정","note":"가맹점별 투자자산 표의 비중은 분모가 다르다 — 투자자산이 아니라 투자실행액이다. 8곳 합이 100.0% 다.","shot":"invest-assets.webp","symbol":null,"href":"https://payhug-investor-demo.vercel.app/invest-assets.html"},{"no":19,"image":1,"term":"순현금의 비중","quote":"순현금의 비중 = 순현금 / (투자실행액 + 순현금)","plain":"투자자 돈 가운데 채권으로 나가지 않고 계좌에 남은 몫이다. 투자 실행액의 비중과 더하면 100.0% 다.","formula":"순현금의 비중 = 순현금 / (투자실행액 + 순현금)","our_value":"20.0%","screen":"투자 자산 > 현황 표 『순현금』 행 『비중』 칸 · 상단 현황 3번째 카드 보조문구 『비중 20.0% · 보관 ㈜쿠콘』 (invest-assets.html)","status":"확정","note":"3차 미팅에서 잡은 시뮬레이션 조건은 유휴자금 20~30% 다. 화면 예시값은 20% 자리다.","shot":"invest-assets.webp","symbol":null,"href":"https://payhug-investor-demo.vercel.app/invest-assets.html"},{"no":20,"image":2,"term":"일별 배치 작업","quote":"매일 자정일 지나면, 배치 작업으로, 유동화투자자별로 ‘정산예정일이 전일자인 정산금채권의 ID들’ 추출하고, 상기 각 대상정산금채권별로 선정산일자 검색하고, 아래와 같이 전일자(D-1) 대상정산금채권의 상환액(SBD-1), 투자실행금(SAD-1), 투자수익(SMD-1), 투자수익율(SMRD-1), w금융일수(SDD-1), ty수익율, 평균순현금 산출해 DB 업데이트","plain":"매일 자정이 지나면 어제 몫을 한 번에 계산해 저장한다. 대상은 '정산예정일이 어제인 채권' 이지 '어제 만들어진 채권' 이 아니다. 어제 돌아오기로 한 채권을 골라 각각의 선정산일자를 찾고, 상환액 · 투자실행금 · 투자수익 · 투자수익율 · w금융일수 · ty수익율 · 평균순현금 일곱 가지를 하루치로 낸다. 화면 일별 표의 한 행이 이 계산 한 번의 결과다.","formula":null,"our_value":"일별 원장 180일 (2026-03-01 ~ 2026-08-27)","screen":"투자 수익 > 일별 투자수익 표 (invest-profit.html)","status":"확정","note":"d-1 이 붙은 산식은 정산예정일이 전일자인 채권만을 모집단으로 한다 (3차 미팅 확정). 단순히 어제 생긴 채권이 아니다. 산출 목록의 '평균순현금' 은 이 줄에만 나오고 아래에 정의문이 없다. EC · PSC 와의 관계는 정해지지 않았다. 대표 DM 2026-08-31 15:15 — 「어제가 지급예정일인~ 것들의 *합계* 무조건 이렇게 논리를 이렇게 잡아야 한다」.","shot":"invest-profit.webp","symbol":null,"href":"https://payhug-investor-demo.vercel.app/invest-profit.html"},{"no":21,"image":2,"term":"전일자 대상정산금채권의 상환액 (SBD-1)","quote":"전일자(D-1) 대상정산금채권의 상환액(SBD-1) = Σ BD-1i","plain":"정산예정일이 어제인 채권들에서 실제로 돌아온 돈의 하루치 합계다. 낱개 상환액 B_{d-1,i} 를 전부 더한 값이다.","formula":"SB_{d-1} = Σ B_{d-1,i}","our_value":"2026-08-27 행 26,530,744원 · 일주일 합계 180,032,094원","screen":"투자 수익 > 일별 투자수익 표 『상환액』 열 (invest-profit.html)","status":"확정","note":"원문 표기는 아래첨자를 평문으로 붙인 SBD-1 이다. 문서 서술에서는 SB_{d-1} 로 쓴다. 이 값은 예상치가 아니라 일별 배치가 낸 결과치다 (3차 미팅 확정).","shot":"invest-profit.webp","symbol":"SB_{d-1}","href":"https://payhug-investor-demo.vercel.app/invest-profit.html"},{"no":22,"image":2,"term":"Σ BD-1i (낱개 상환액)","quote":"Σ BD-1i = 정산예정일이 전일자(D-1)인 모든 대상정산금채권의 ‘순지급액 - max(0, 미지급금-과지급금)’의 합","plain":"낱개 상환액을 어떻게 만드는지 적은 줄이다. 받기로 한 순지급액에서 못 받은 만큼을 깎는다. max(0, 미지급금 − 과지급금) 의 max(0, …) 는 과지급이 미지급보다 많을 때 값이 음수가 되는 것을 막는 바닥이다. 덜 들어온 만큼만 깎고, 더 들어왔다고 상환액을 부풀리지는 않는다.","formula":"B_{d-1,i} = 순지급액 − max(0, 미지급금 − 과지급금)","our_value":"일주일 합계 180,032,094원","screen":"투자 수익 > 일별 투자수익 표 『상환액』 열 (invest-profit.html)","status":"확정","note":"max(0, …) 읽는 법은 3차 미팅에서 확인됐다 — 미지급금에서 과지급금을 뺀 값이 음수면 0 으로 본다. 깎는 금액을 입금부족액 L 이라 부른다. 원장에서 B_{d-1,i} − A_{d-1,i} = M_{d-1,i} 항등식이 성립하려면 채권매입수수료 = 순지급액 × 할인율 이어야 한다.","shot":"invest-profit.webp","symbol":"B_{d-1,i}","href":"https://payhug-investor-demo.vercel.app/invest-profit.html"},{"no":23,"image":2,"term":"전일자 대상정산금채권의 투자실행금 (SAD-1)","quote":"전일자(D-1) 대상정산금채권의 투자실행금(SAD-1) = Σ AD-1i","plain":"정산예정일이 어제인 채권들에 투자자가 넣었던 돈의 하루치 합계다. 투자 실행액이 어느 시점의 잔액인 것과 달리 이 값은 하루에 도래한 몫이다.","formula":"SA_{d-1} = Σ A_{d-1,i}","our_value":"2026-08-27 행 26,521,983원 · 일주일 합계 179,970,919원","screen":"투자 수익 > 일별 투자수익 표 『투자실행금』 열 (invest-profit.html)","status":"확정","note":"철자가 비슷한 SA_i (표본 채권 1건분) 와 다른 것이다. 화면 이름도 투자실행액과 투자실행금으로 갈라 쓴다.","shot":"invest-profit.webp","symbol":"SA_{d-1}","href":"https://payhug-investor-demo.vercel.app/invest-profit.html"},{"no":24,"image":2,"term":"Σ AD-1i (낱개 투자실행금)","quote":"Σ AD-1i = 정산예정일이 전일자(D-1)인 모든 대상정산금채권의 ‘순지급액 x (1 - 유동화투자자의 할인율)’의 합","plain":"낱개 투자실행금을 어떻게 만드는지 적은 줄이다. 순지급액에 (1 − 할인율) 을 곱한다. A_i 와 계산이 같고 고르는 범위만 '정산예정일이 어제' 로 좁힌 것이다.","formula":"A_{d-1,i} = 순지급액 × (1 − 할인율)","our_value":"일주일 합계 179,970,919원","screen":"투자 수익 > 일별 투자수익 표 『투자실행금』 열 (invest-profit.html)","status":"확정","note":null,"shot":"invest-profit.webp","symbol":"A_{d-1,i}","href":"https://payhug-investor-demo.vercel.app/invest-profit.html"},{"no":25,"image":2,"term":"전일자 대상정산금채권의 투자수익 (SMD-1)","quote":"전일자(D-1) 대상정산금채권의 투자수익(SMD-1) = Σ MD-1i","plain":"정산예정일이 어제인 채권들에서 투자자가 남긴 돈의 하루치 합계다.","formula":"SM_{d-1} = Σ M_{d-1,i}","our_value":"2026-08-27 행 8,761원 · 일주일 합계 61,175원","screen":"투자 수익 > 일별 투자수익 표 『투자 수익』 열 · 현황 카드 『투자수익』 (invest-profit.html)","status":"확정","note":null,"shot":"invest-profit.webp","symbol":"SM_{d-1}","href":"https://payhug-investor-demo.vercel.app/invest-profit.html"},{"no":26,"image":2,"term":"MD-1i (낱개 투자수익)","quote":"MD-1i = 정산예정일이 전일자(D-1)이면서 ID가 i인 대상정산금채권의 채권매입수수료 - max(0, 미지급금-과지급금)","plain":"채권 한 건에서 투자자가 남긴 돈이다. 받기로 한 채권매입수수료에서 못 받은 만큼을 깎는다. 깎는 금액은 상환액 쪽과 같은 max(0, 미지급금 − 과지급금) 이다.","formula":"M_{d-1,i} = 채권매입수수료 − max(0, 미지급금 − 과지급금)","our_value":"일주일 합계 61,175원","screen":"투자 수익 > 일별 투자수익 표 『투자 수익』 열 (invest-profit.html)","status":"확인필요","note":"재료인 '채권매입수수료' 가 투자자 몫만인지 페이허그·파트너까지 나눠 갖는 통 전체인지 원문에 없다. 수익률 세 개(④·⑤·⑥)가 전부 여기에 걸린다. 원장은 채권매입수수료 = 순지급액 × 할인율 로 두었고, 그래야 B_{d-1,i} − A_{d-1,i} = M_{d-1,i} 항등식이 성립한다.","shot":"invest-profit.webp","symbol":"M_{d-1,i}","href":"https://payhug-investor-demo.vercel.app/invest-profit.html"},{"no":27,"image":2,"term":"전일자 대상정산금채권의 투자수익율 (SMRD-1)","quote":"전일자(D-1) 대상정산금채권의 투자수익율(SMRD-1) = Σ MD-1i / Σ AD-1i","plain":"어제 하루치로 몇 % 벌었는지다. 남긴 돈을 넣었던 돈으로 나눈다. 1년으로 늘리기 전 값이라 아주 작다.","formula":"SMR_{d-1} = Σ M_{d-1,i} / Σ A_{d-1,i}","our_value":null,"screen":null,"status":"확정","note":"화면에 뜨지 않고 하루치 ty수익율의 재료로만 쓰인다. 미지급금에서 과지급금을 뺀 값이 0 이면 이 값이 할인율과 같아진다. 원장 산식으로 정확히 쓰면 할인율 ÷ (1 − 할인율) = 0.110121% 이고, 표기 두 자리에서는 할인율과 같은 0.11% 다. 대표 DM 2026-08-31 16:45 — 「투자수익률은 할인율 -max(0, 미지급금-과지급금)/투자실행액 이므로 미지급-과지급이 0이면 할인율이 되므로 같다. 수익률 같음」. 이 항등식은 근사식이다. 대표 DM 이 적은 「할인율 -max(0, 미지급금-과지급금)/투자실행액」 의 분모는 투자실행액이고, 원식 Σ M / Σ A 의 분모는 순지급액 × (1 − 할인율) 이라 1 ÷ (1 − 할인율) 배만큼 갈린다. 부족액이 0 일 때 두 값은 0.11% (대표 DM) 와 0.110121% (원장 산식) 다. 어느 쪽이 정본인지는 판정하지 않았다.","shot":null,"symbol":"SMR_{d-1}","href":null},{"no":28,"image":2,"term":"전일자 대상정산금채권의 w금융일수 (SDD-1)","quote":"전일자(D-1) 대상정산금채권의 w금융일수(SDD-1) = (Σ AD-1i x DD-1i) / Σ AD-1i","plain":"정산예정일이 어제인 채권들이 평균 며칠짜리였는지다. 잔액 쪽 w금융일수와 계산이 같고 고르는 범위만 '정산예정일이 어제' 로 좁힌 것이다.","formula":"SD_{d-1} = (Σ A_{d-1,i} × D_{d-1,i}) / Σ A_{d-1,i}","our_value":"2026-08-27 행 3.11일","screen":"투자 수익 > 일별 투자수익 표 『W금융일수』 열 (invest-profit.html)","status":"확정","note":null,"shot":"invest-profit.webp","symbol":"SD_{d-1}","href":"https://payhug-investor-demo.vercel.app/invest-profit.html"},{"no":29,"image":2,"term":"AD-1i","quote":"AD-1i = 정산예정일이 전일자(D-1)이면서 ID가 i인 대상정산금채권의 순지급액 x (1- 유동화투자자의 할인율)","plain":"정산예정일이 어제인 채권 한 건을 투자자가 샀던 값이다. 하루치 w금융일수의 가중치이자 하루치 투자수익율의 분모다.","formula":"A_{d-1,i} = 순지급액 × (1 − 할인율)","our_value":null,"screen":null,"status":"확정","note":"원문이 같은 산식을 범위만 바꿔 세 벌 적는다 — A_i (잔액·미회수분) · A_{d-1,i} (전일자 도래분) · A_{p,i} (기간 도래분).","shot":null,"symbol":"A_{d-1,i}","href":null},{"no":30,"image":2,"term":"DD-1i","quote":"DD-1i = 정산예정일이 전일자(D-1)이면서 ID가 i인 대상정산금채권의 금융일수","plain":"정산예정일이 어제인 채권 한 건이 며칠짜리였는지다. D_i 와 같은 값이고 범위만 좁힌 것이다.","formula":"D_{d-1,i} = 정산예정일 − 선정산일","our_value":"1일 ~ 13일","screen":null,"status":"확정","note":"앞 D 는 금융일수라 대문자, 뒤 d-1 은 정산예정일이 어제인 대상정산금채권 집합이라 소문자다 (기호 규칙 2026-08-31 · dm_0831/symbol_rule_0831.md). 이 방향은 잠정이다 — 대표 DM 은 금융일수 쪽을 다른 글자로 바꾸라 했고 확정 규칙은 날짜 쪽을 소문자 d 로 내렸다. 4차 미팅에서 대표 확인을 받는다.","shot":null,"symbol":"D_{d-1,i}","href":null},{"no":31,"image":2,"term":"금융일수 (전일자 기준)","quote":"금융일수 = 선정산일로부터 정산예정일(=전일자)까지의 한편 넣기 일수 (예, 선정산일이 20260824면이고 정산예정일이 20260826이면, 2)","plain":"1번 이미지의 금융일수와 같은 정의를 전일자 기준으로 다시 적은 줄이다. 정산예정일이 어제로 고정된 것만 다르다. 예시는 8월 24일에 나가 8월 26일에 들어와 2일이다.","formula":"금융일수 = 정산예정일(= 전일자) − 선정산일","our_value":"1일 ~ 13일","screen":null,"status":"확정","note":"원문 표기 그대로 옮김. '20260824면이고' 는 '20260824이고' 의 오기로 보임. 1번 이미지 쪽 예시(260827 → 260808)와 달리 이쪽 예시는 날짜가 어긋나지 않는다. 금융일수 쪽 표기는 대문자 D 로 둔다 (기호 규칙 2026-08-31 · dm_0831/symbol_rule_0831.md). 이 방향은 잠정이다 — 대표 DM 은 금융일수 쪽을 다른 글자로 바꾸라 했고 확정 규칙은 날짜 쪽을 소문자 d 로 내렸다. 4차 미팅에서 대표 확인을 받는다.","shot":null,"symbol":"D_{d-1,i}","href":null},{"no":32,"image":2,"term":"전일자 대상정산금채권의 ty수익율","quote":"전일자(D-1) 대상정산금채권의 ty수익율 = SMRD-1 x 365 / SDD-1","plain":"어제 하루치 수익률을 1년으로 늘린 값이다. 하루치 투자수익율에 365 를 곱하고 그날 w금융일수로 us":"확정","note":"이름은 3차 미팅에서 대표가 승인했다 — 「위 선택한 기간에 해당하는 w금융일수」. 8/31 판 정의서에 그 문구가 주석으로 붙어 있다. 대표 DM 2026-08-31 16:42 가 같은 산식과 이름을 다시 적었다 — 「l PSD = (Σ Api x Dpi) / PSA -> 위 선택한 기간에 해당하는 w금융일수」.","shot":"invest-profit.webp","symbol":"PSD","href":"https://payhug-investor-demo.vercel.app/invest-profit.html"},{"no":40,"image":2,"term":"Api","quote":"Api : 정산예정일이 위 선택한 기간에 해당하는 모든 각 대상정산금채권의 ‘순지급액 x ( 1 – 유동화투자자 할인율)’","plain":"정산예정일이 고른 기간에 든 채권 한 건을 투자자가 샀던 값이다. 식은 A_i 와 같고 범위만 다르다.","formula":"A_{p,i} = 순지급액 × (1 − 할인율)","our_value":null,"screen":null,"status":"확정","note":"원문이 이 줄에서만 할인율 앞에 '유동화투자자' 를 붙이지 않고 '유동화투자자 할인율' 로 붙여 썼다. 뜻은 같다.","shot":null,"symbol":"A_{p,i}","href":null},{"no":41,"image":2,"term":"Dpi","quote":"Dpi: 정산예정일이 위 선택한 기간에 해당하는 모든 각 대상정산금채권의 금융일수","plain":"정산예정일이 고른 기간에 든 채권 한 건이 며칠짜리였는지다. D_i 와 같은 값이고 범위만 다르다.","formula":"D_{p,i} = 정산예정일 − 선정산일","our_value":"1일 ~ 13일","screen":null,"status":"확정","note":"금융일수 쪽 표기는 대문자 D 로 두고 날짜 쪽만 소문자 d 로 내렸다 (기호 규칙 2026-08-31 · dm_0831/symbol_rule_0831.md). D_{p,i} 표기는 그대로다. 이 방향은 잠정이다 — 대표 DM 은 금융일수 쪽을 다른 글자로 바꾸라 했고 확정 규칙은 날짜 쪽을 소문자 d 로 내렸다. 4차 미팅에서 대표 확인을 받는다.","shot":null,"symbol":"D_{p,i}","href":null},{"no":42,"image":2,"term":"투자자산 대비 ty수익율 (이미지의 ⑤)","quote":"투자자산 대비 ty수익율 (이미지의 ⑤) = (이미지의 ④ x PSA) / (PSA + PSC)","plain":"채권으로 나가지 않고 놀고 있는 현금까지 분모에 넣은 수익률이다. ④ 가 '한 푼도 놀리지 않았을 때' 라면 ⑤ 는 '20~30% 가 놀고 있을 때' 다. 그래서 ⑤ 는 늘 ④ 보다 작다.","screen":"투자 수익 > 현황 카드 『Ty수익율 · 투자자산 대비』 (invest-profit.html)","status":"대기","note":"3차 미팅에서 대표가 이 수식을 잘못 썼다고 말하고 새로 써서 전달하기로 했다. 무엇이 어떻게 틀렸는지는 말하지 않았고 기한도 정해지지 않았다. 화면은 원문 수식대로 계산한 값에 『미확정 · 대표 재전달 대기』 표시를 붙여 두었다. PSC 를 합으로 볼지 평균으로 볼지도 이 재작성에 딸려 있다. 원고는 ⑤ 산식을 pending_formula 한 곳에서만 들고 있다. 그 한 줄을 갈면 42항·45항과 워드·HTML 이 함께 바뀐다. ⑥ 이 ⑤ 를 가져다 쓰므로 ⑤ 가 바뀌면 ⑥ 도 함께 바뀐다.","shot":"invest-profit.webp","symbol":"③④⑤⑥","formula_ref":"pending_formula","href":"https://payhug-investor-demo.vercel.app/invest-profit.html"},{"no":43,"image":2,"term":"PSC","quote":"PSC = 위 선택한 기간의 EC들의 합","plain":"고른 기간의 <script>
(function(){
"use strict";

var SEED = JSON.parse(document.getElementById("seed").textContent);
var SHOTS = JSON.parse(document.getElementById("shots").textContent);
var SRC = null;
var dirty = false;
var pub = null;
var dl = null;

var $ = function(s,r){return (r||document).querySelector(s)};
var esc = function(s){return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")};

/* ── 자기 원본 ───────────────────────────────── */
function b64dec(s){
  var bin = atob(s), b = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}
/* #src 는 JSON 문자열 하나다. 따옴표째 atob 에 넘기면 그 자리에서 깨진다. */
try { SRC = b64dec(JSON.parse(document.getElementById("src").textContent)); }
catch(e){ SRC = null; }

function jsonFor(o){ return JSON.stringify(o).split("</").join("<\\/"); }

var TK = function(n){ return "%"+"%" + n + "%"+"%" };

function renderDoc(){
  if (!SRC) return null;
  var cut = SRC.indexOf(TK("SRC"));
  if (cut < 0) return null;
  var before = SRC.slice(0, cut), after = SRC.slice(cut + TK("SRC").length);
  var fill = function(s){
    return s.split(TK("SEED")).join(jsonFor(SEED))
            .split(TK("SHOTS")).join(jsonFor(SHOTS));
  };
  var b = new TextEncoder().encode(SRC), raw = "", CH = 0x8000;
  for (var i=0;i<b.length;i+=CH) raw += String.fromCharCode.apply(null, b.subarray(i,i+CH));
  return wrapFull(fill(before) + btoa(raw) + fill(after));
}

/* 조각에 껍데기를 씌운다. 생성기의 full() 과 같은 절차다.
   조각 맨 앞의 <title> 은 머리로 옮긴다 — 본문에 남으면 글자로 찍힌다. */
function wrapFull(frag){
  var m = /^\s*<title>([\s\S]*?)<\/title>\s*/.exec(frag);
  var title = m ? m[1] : "용어 정의서";
  var body = m ? frag.slice(m[0].length) : frag;
  return '<!doctype html>\n<html lang="ko">\n<head>\n'
       + '<meta charset="utf-8">\n'
       + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
       + '<title>' + title + '</title>\n</head>\n<body>\n'
       + body + '\n</body>\n</html>\n';
}

/* ── 그리기 ───────────────────────────────── */
var FIELDS = [
  ["formula","산식","mono"],
  ["symbol","기호","mono"],
  ["our_value","우리 값","num"],
  ["screen","화면",""],
  ["note","비고",""]
];

/* 대기 중인 산식은 원고 한 곳(pending_formula)에서만 온다.
   42항(⑤)은 그 블록을, 45항(⑥)은 그 블록의 depends 를 가리킨다. */
function pfmark(b){
  /* 대체 여부는 따로 적어 두지 않고 두 문자열을 견줘 낸다.
     그래야 대표 산식이 왔을 때 formula 한 줄만 고쳐도 표시가 맞는다. */
  return b.formula === b.basis_formula ? b.status : "";
}

function pf(it){
  var b = SEED.pending_formula;
  if (!b || !it.formula_ref) return null;
  var src = it.no === b.no ? b
          : (b.depends||[]).filter(function(x){ return x.no === it.no })[0];
  if (!src) return null;
  return {formula:src.formula, our_value:src.our_value, status:pfmark(b)};
}

function cardHTML(it, idx){
  var st = it.status || "확정";
  var h = '<article class="card" id="t'+it.no+'" data-i="'+idx+'">';

  h += '<div class="top"><span class="no">'+String(it.no).padStart(2,"0")+'</span>';
  h += '<h3 contenteditable data-f="term" data-ph="용어">'+esc(it.term)+'</h3>';
  if (it.symbol) h += '<span class="sym">'+esc(it.symbol)+'</span>';
  h += '<button class="pill s'+st+'" data-act="st" title="상태 바꾸기">'+st+'</button>';
  h += '<span class="ops">'
     + '<button data-act="up" title="위로">↑</button>'
     + '<button data-act="down" title="아래로">↓</button>'
     + '<button data-act="add" title="아래에 항목 추가">＋</button>'
     + '<button data-act="del" class="del" title="항목 삭제">✕</button>'
     + '</span></div>';

  if (it.quote)
    h += '<blockquote class="q"><span class="tag">대표 원문 · 고칠 수 없음</span>'
       + esc(it.quote) + '</blockquote>';

  h += '<div class="body">';
  h += '<p class="plain" contenteditable data-f="plain" data-ph="풀이를 쓰세요">'
     + esc(it.plain) + '</p>';

  var rows = "", p = pf(it);
  FIELDS.forEach(function(f){
    if (p && (f[0] === "formula" || f[0] === "our_value")){
      var pv = f[0] === "formula" ? p.formula : p.our_value;
      if (pv == null || pv === "") return;
      rows += '<div class="k">'+f[1]+'</div>'
            + '<div class="v '+f[2]+'">'+esc(pv)
            + (p.status ? '<span class="mark">'+esc(p.status)+'</span>' : '')
            + '</div>';
      return;
    }
    if (it[f[0]] == null || it[f[0]] === "") return;
    rows += '<div class="k">'+f[1]+'<button data-act="rmf" data-f="'+f[0]+'" title="이 줄 지우기">×</button></div>'
          + '<div class="v '+f[2]+'" contenteditable data-f="'+f[0]+'">'+esc(it[f[0]])+'</div>';
  });
  (it.extra||[]).forEach(function(x,j){
    rows += '<div class="k" contenteditable data-f="xk" data-j="'+j+'">'+esc(x.k)+'</div>'
          + '<div class="v" contenteditable data-f="xv" data-j="'+j+'">'+esc(x.v)+'</div>';
  });
  if (rows) h += '<div class="rows">'+rows+'</div>';

  var miss = FIELDS.filter(function(f){
    if (p && (f[0] === "formula" || f[0] === "our_value")) return false;
    return it[f[0]] == null || it[f[0]] === "";
  });
  h += '<div class="addrow">';
  miss.forEach(function(f){ h += '<button data-act="addf" data-f="'+f[0]+'">＋ '+f[1]+'</button>' });
  h += '<button data-act="addx">＋ 내가 만든 줄</button></div>';

  var sh = it.shot && SHOTS[it.shot];
  if (sh || it.href){
    h += '<div class="shots">';
    if (sh) h += '<figure><img src="'+SHOTS[it.shot]+'" alt="'+esc(it.term)+' 화면" '
               + 'data-act="zoom" data-shot="'+esc(it.shot)+'">'
               + '<figcaption>'+esc(it.shot)+' · 눌러서 확대</figcaption></figure>';
    if (it.href) h += '<a class="golink" href="'+esc(it.href)+'" target="_blank" '
                    + 'rel="noopener">실제 화면 열기 ↗</a>';
    h += '</div>';
  }

  return h + '</div></article>';
}

function render(){
  var items = SEED.items;
  var h = "";

  h += '<div class="head"><h2 contenteditable data-g="title">'+esc(SEED.title)+'</h2>';
  h += '<p class="sub" contenteditable data-g="basis">'+esc(SEED.basis)+'</p>';
  var sc = SEED.scale || {};
  h += '<dl class="facts">'
     + '<div><dt>기준일</dt><dd>'+esc(SEED.asof)+'</dd></div>'
     + '<div><dt>투자실행액</dt><dd>'+(sc["투자실행액"]||0).toLocaleString()+'원</dd></div>'
     + '<div><dt>순현금</dt><dd>'+(sc["순현금"]||0).toLocaleString()+'원</dd></div>'
     + '<div><dt>가맹점</dt><dd>'+(sc["가맹점수"]||0)+'곳</dd></div>'
     + '<div><dt>할인율</dt><dd>'+((sc["할인율"]||0)*100)+'%</dd></div>'
     + '<div><dt>항목</dt><dd>'+items.length+'항</dd></div></dl></div>';

  if ((SEED.pending||[]).length){
    h += '<div class="pend"><h3>미결</h3><ul>';
    SEED.pending.forEach(function(p,i){
      h += '<li><b contenteditable data-p="item" data-j="'+i+'">'+esc(p.item)+'</b> · '
         + '<span contenteditable data-p="who" data-j="'+i+'">'+esc(p.who)+'</span> — '
         + '<span contenteditable data-p="what" data-j="'+i+'">'+esc(p.what)+'</span></li>';
    });
    h += '</ul>';
    var b = SEED.pending_formula;
    if (b){
      var to = [b.no].concat((b.depends||[]).map(function(x){ return x.no }));
      h += '<div class="pf"><div class="lb">'+esc(b.ref)+' '+esc(b.term)
         + (pfmark(b) ? ' · '+esc(pfmark(b)) : '')+'</div>'
         + '<div class="fx" contenteditable data-pf="formula">'+esc(b.formula)+'</div>'
         + '<div class="to">'+to.map(function(n){ return n+"항" }).join(" · ")
         + ' · ' + esc((b.depends||[]).map(function(x){
             return x.ref+" = "+x.formula }).join(" · ")) + '</div></div>';
    }
    h += '</div>';
  }

  var seen = {};
  items.forEach(function(it, i){
    var g = it.image || 1;
    if (!seen[g]){
      seen[g] = 1;
      var n = items.filter(function(x){return (x.image||1)===g}).length;
      h += '<h2 class="sep">['+g+'번 이미지]<span>'+n+'항</span></h2>';
    }
    h += cardHTML(it, i);
  });
  h += '<div class="newitem"><button class="btn" data-act="addend">＋ 맨 끝에 항목 추가</button></div>';

  $("#doc").innerHTML = h;
  toc();
  filter();
}

function toc(){
  var h = "", seen = {};
  SEED.items.forEach(function(it){
    var g = it.image || 1;
    if (!seen[g]){ seen[g]=1; h += '<div class="grp">'+g+'번 이미지</div>' }
    var cls = it.status === "대기" ? "wait" : it.status === "확인필요" ? "check" : "";
    h += '<a href="#t'+it.no+'" class="'+cls+'"><span class="n">'
       + String(it.no).padStart(2,"0")+'</span><span>'+esc(it.term)+'</span></a>';
  });
  $("#toc").innerHTML = h;
}

/* ── 고르기 ───────────────────────────────── */
function filter(){
  var q = ($("#q").value || "").trim().toLowerCase();
  var only = $("#only").value;
  var n = 0;
  SEED.items.forEach(function(it, i){
    var el = document.querySelector('.card[data-i="'+i+'"]');
    if (!el) return;
    var okQ = !q || (it.term+" "+it.quote+" "+it.plain+" "+(it.formula||"")+" "+
                     (it.note||"")+" "+(it.symbol||"")).toLowerCase().indexOf(q) >= 0;
    var okS = only === "all" || it.status === only;
    var show = okQ && okS;
    el.classList.toggle("hide", !show);
    if (show) n++;
  });
  $("#cnt").textContent = n + " / " + SEED.items.length + "항";
}

/* ── 고치기 ───────────────────────────────── */
function mark(){
  if (dirty) return;
  dirty = true;
  say("고친 것이 있습니다", "on");
  $("#save").disabled = false;
}

function idx(el){ var c = el.closest(".card"); return c ? +c.dataset.i : -1 }

document.addEventListener("input", function(e){
  var el = e.target;
  if (!el.isContentEditable) return;
  var t = el.textContent;
  if (el.dataset.g){ SEED[el.dataset.g] = t; mark(); return }
  if (el.dataset.p){ SEED.pending[+el.dataset.j][el.dataset.p] = t; mark(); return }
  if (el.dataset.pf){ SEED.pending_formula[el.dataset.pf] = t; mark(); return }
  var i = idx(el); if (i < 0) return;
  var f = el.dataset.f;
  if (f === "xk") SEED.items[i].extra[+el.dataset.j].k = t;
  else if (f === "xv") SEED.items[i].extra[+el.dataset.j].v = t;
  else if (f) SEED.items[i][f] = t;
  mark();
});

document.addEventListener("paste", function(e){
  if (!e.target.isContentEditable) return;
  e.preventDefault();
  document.execCommand("insertText", false,
    (e.clipboardData || window.clipboardData).getData("text/plain"));
});

var STATES = ["확정","대기","확인필요"];

function renumber(){ SEED.items.forEach(function(it,i){ it.no = i+1 }) }

document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if (!b) return;
  var act = b.dataset.act, i = idx(b);

  if (act === "zoom"){ zoom(b.dataset.shot); return }

  if (act === "st"){
    var it = SEED.items[i];
    it.status = STATES[(STATES.indexOf(it.status||"확정")+1) % 3];
    b.textContent = it.status;
    b.className = "pill s"+it.status;
    toc(); mark(); return;
  }
  if (act === "up" || act === "down"){
    var j = act === "up" ? i-1 : i+1;
    if (j < 0 || j >= SEED.items.length) return;
    var a = SEED.items;
    var g = a[i].image; a[i].image = a[j].image; a[j].image = g;
    var t = a[i]; a[i] = a[j]; a[j] = t;
    renumber(); mark(); render();
    var el = document.querySelector('.card[data-i="'+j+'"]');
    if (el) el.scrollIntoView({block:"center"});
    return;
  }
  if (act === "del"){
    if (!confirm("“"+(SEED.items[i].term||"이 항목")+"” 을 지웁니다.")) return;
    SEED.items.splice(i,1); renumber(); mark(); render(); return;
  }
  if (act === "add" || act === "addend"){
    var at = act === "add" ? i+1 : SEED.items.length;
    var img = act === "add" ? (SEED.items[i].image||1)
                            : ((SEED.items[SEED.items.length-1]||{}).image||1);
    SEED.items.splice(at, 0, {no:0, image:img, term:"", quote:"", plain:"",
                              status:"확인필요", extra:[]});
    renumber(); mark(); render();
    var nel = document.querySelector('.card[data-i="'+at+'"] h3');
    if (nel){ nel.scrollIntoView({block:"center"}); nel.focus() }
    return;
  }
  if (act === "addf"){ SEED.items[i][b.dataset.f] = ""; mark(); render();
    var fe = document.querySelector('.card[data-i="'+i+'"] [data-f="'+b.dataset.f+'"]');
    if (fe){ fe.scrollIntoView({block:"center"}); fe.focus() } return }
  if (act === "rmf"){ delete SEED.items[i][b.dataset.f]; mark(); render(); return }
  if (act === "addx"){
    var it2 = SEED.items[i];
    it2.extra = it2.extra || [];
    it2.extra.push({k:"이름", v:""});
    mark(); render();
    var xe = document.querySelector('.card[data-i="'+i+'"] [data-f="xk"][data-j="'
                                    +(it2.extra.length-1)+'"]');
    if (xe){ xe.scrollIntoView({block:"center"}); xe.focus() }
    return;
  }
});

/* ── 확대 ───────────────────────────────── */
var lb = {k:1, x:0, y:0, w:0, h:0, on:false};

function zoom(name){
  var src = SHOTS[name]; if (!src) return;
  var im = $("#lbimg");
  im.onload = function(){
    lb.w = im.naturalWidth; lb.h = im.naturalHeight;
    fit(); 
  };
  im.src = src;
  $("#lbname").textContent = name;
  $("#lb").classList.add("on");
  lb.on = true;
}
function apply(){
  var im = $("#lbimg");
  im.style.transform = "translate("+lb.x+"px,"+lb.y+"px) scale("+lb.k+")";
  $("#lbzm").textContent = Math.round(lb.k*100)+"%";
}
function fit(){
  var st = $("#lbstage");
  var k = Math.min((st.clientWidth-56)/lb.w, (st.clientHeight-104)/lb.h, 1);
  lb.k = k; lb.x = (st.clientWidth - lb.w*k)/2; lb.y = (st.clientHeight - lb.h*k)/2 + 18;
  apply();
}
function scale(k, cx, cy){
  var st = $("#lbstage");
  cx = cx == null ? st.clientWidth/2 : cx;
  cy = cy == null ? st.clientHeight/2 : cy;
  var nk = Math.min(8, Math.max(.08, k));
  lb.x = cx - (cx - lb.x) * (nk/lb.k);
  lb.y = cy - (cy - lb.y) * (nk/lb.k);
  lb.k = nk; apply();
}
function close(){ $("#lb").classList.remove("on"); lb.on = false; $("#lbimg").src = "" }

$("#lbfit").onclick = fit;
$("#lb1").onclick = function(){ scale(1) };
$("#lbin").onclick = function(){ scale(lb.k*1.35) };
$("#lbout").onclick = function(){ scale(lb.k/1.35) };
$("#lbx").onclick = close;
$("#lb").addEventListener("click", function(e){ if (e.target.id === "lbstage") close() });
$("#lbstage").addEventListener("wheel", function(e){
  e.preventDefault();
  var r = e.currentTarget.getBoundingClientRect();
  scale(lb.k * (e.deltaY < 0 ? 1.12 : 1/1.12), e.clientX-r.left, e.clientY-r.top);
}, {passive:false});
(function(){
  var st = $("#lbstage"), down = false, px = 0, py = 0;
  st.addEventListener("pointerdown", function(e){
    down = true; px = e.clientX; py = e.clientY;
    st.classList.add("drag"); st.setPointerCapture(e.pointerId);
  });
  st.addEventListener("pointermove", function(e){
    if (!down) return;
    lb.x += e.clientX - px; lb.y += e.clientY - py;
    px = e.clientX; py = e.clientY; apply();
  });
  st.addEventListener("pointerup", function(){ down = false; st.classList.remove("drag") });
  st.addEventListener("pointercancel", function(){ down = false; st.classList.remove("drag") });
})();
window.addEventListener("keydown", function(e){
  if (!lb.on) return;
  if (e.key === "Escape") close();
  else if (e.key === "+" || e.key === "=") scale(lb.k*1.35);
  else if (e.key === "-") scale(lb.k/1.35);
  else if (e.key === "0") fit();
});

/* ── 저장 ───────────────────────────────── */
function say(t, cls){ var s = $("#st"); s.textContent = t; s.className = "state "+(cls||"") }

$("#q").addEventListener("input", filter);
$("#only").addEventListener("change", filter);

$("#save").addEventListener("click", async function(){
  var doc = renderDoc();
  if (!doc){ say("원본을 못 읽어 저장할 수 없습니다", "bad"); return }
  $("#save").disabled = true;
  say("저장하는 중", "on");
  if (pub){
    try {
      await pub.publish(doc);
      dirty = false; say("저장했습니다", "ok");
      return;
    } catch(err){
      var c = err && err.code;
      if (c === "conflict"){ say("다른 판이 먼저 저장돼 최신 판으로 다시 엽니다", "on"); return }
      if (c === "not_writer" || c === "not_granted" || c === "not_declared"){
        pub = null; say("읽기 전용이라 이 주소에는 저장이 안 됩니다", "bad");
      } else {
        say("저장 실패 ("+(c||"알 수 없음")+")", "bad");
      }
    }
  }
  if (dl){
    try {
      await dl.save({filename:"용어정의서_편집판.html", data:doc});
      dirty = false; say("파일로 내려받았습니다", "ok");
      return;
    } catch(e2){ say("내려받기가 취소됐습니다", "bad") }
  } else {
    say("이 사본에서는 저장이 안 됩니다", "bad");
  }
  $("#save").disabled = false;
});

window.addEventListener("beforeunload", function(e){
  if (dirty){ e.preventDefault(); e.returnValue = "" }
});

/* 검증기가 페이지가 실제로 만드는 문서를 바이트로 대조한다.
   파이썬 쪽 재생산만 보면 페이지 안에서 깨진 것을 못 잡는다. */
window.__renderDoc = renderDoc;
window.__seed = SEED;

render();
say(SRC ? "" : "원본을 못 읽었습니다 — 저장이 안 됩니다", SRC ? "" : "bad");
$("#save").disabled = true;

if (window.claude && window.claude.use){
  claude.use("artifact").then(function(a){
    pub = a;
    if (a) say(dirty ? "고친 것이 있습니다" : "저장할 수 있습니다", dirty ? "on" : "");
  }).catch(function(){});
  claude.use("downloads").then(function(d){ dl = d }).catch(function(){});
}
})();
</script>
