<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>PayHug Admin — 정산채권 양수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
  /* 화면 전용 — 색상은 base.css 변수만 사용 */
  .notice-green { background: var(--primary-50); border-color: var(--primary-200); color: var(--primary-700); }
  .chk { width: 16px; height: 16px; accent-color: var(--primary); flex-shrink: 0; cursor: pointer; }
  .sign-row {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 24px; border-bottom: 1px solid var(--gray-50);
  }
  .sign-row:last-child { border-bottom: 0; }
  .sign-row.selected { background: var(--primary-50); }
  .sign-row .m-name { font-size: 14px; font-weight: 600; color: var(--gray-900); }
  .sign-row .m-date { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
  .sign-row .m-date .mono { color: var(--gray-500); }
  .doc-link { font-size: 14px; font-weight: 500; color: var(--primary-600); text-decoration: none; white-space: nowrap; }
  .doc-link:hover { text-decoration: underline; }
  /* 선택 건수는 목록 아래 왼쪽, 서명 버튼은 가운데 — 쪽번호 줄과 같은 3열 격자다.
     원본 어드민의 다중선택 액션 바도 건수를 왼쪽에 둔다(PreSettlementTab.tsx:1214·1264). */
  .sign-foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 20px 24px 24px; border-top: 1px solid var(--gray-100); background: var(--gray-50); }
  .sign-foot .sel-count { justify-self: start; font-size: 13px; color: var(--gray-600); }
  .sign-foot .sel-count b { color: var(--gray-900); }
  .sign-foot .btn { min-width: 240px; justify-content: center; padding: 12px 40px; font-size: 16px; border-radius: 12px; }
  .list-tools { display: flex; align-items: center; gap: 8px; }
  .tbl-head-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--gray-100); }
</style>
</head>
<body data-active="receivables">

        </div>

    <!-- 서명 대기 목록 -->
    <div class="card" style="padding:0; overflow:hidden">

        <div class="list-tools">

      </div>

      <div class="sign-row pickable">
