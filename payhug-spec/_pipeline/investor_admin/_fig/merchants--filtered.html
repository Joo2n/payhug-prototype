<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>PayHug Admin — 가맹점 · 검색 적용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
  /* 화면 전용 — 색상은 base.css 변수만 사용 */
  /* 상태 표시 뱃지 — 제안서 화면 구분용 */
  .state-flag {
    display: inline-block; margin-left: 10px; vertical-align: middle;
    padding: 4px 10px; border-radius: 9999px;
    background: var(--gray-100); color: var(--gray-500);
    font-size: 12px; line-height: 16px; font-weight: 500;
  }
  /* 적용된 검색 조건 칩 */
  .chip-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip-label { font-size: 12px; line-height: 16px; color: var(--secondary); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 9999px;
    background: var(--primary-50); border: 1px solid var(--primary-200); color: var(--primary-700);
    font-size: 12px; line-height: 16px; font-weight: 500;
  }
  .chip button { display: flex; background: none; border: 0; padding: 0; color: var(--primary-600); }
  .chip svg { width: 12px; height: 12px; }
  .chip-clear {
    background: none; border: 0; padding: 0;
    font-size: 12px; line-height: 16px; color: var(--gray-500); text-decoration: underline;
  }
  .pagination.with-count { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .pagination.with-count .pg-count { justify-self: start; font-size: 12px; color: var(--gray-500); }
  .pagination.with-count .pg-nums { display: flex; align-items: center; gap: 4px; justify-self: center; }
  .pg-size { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--gray-500); }
  .input.sz { padding: 4px 24px 4px 10px; font-size: 12px; height: 28px; border-radius: 8px; }
</style>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=block" rel="stylesheet">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body data-active="merchants">
<div class="page">

  <!-- ═══════════ 사이드바 (수정 금지 — 화면마다 동일) ═══════════ -->

    <div class="sidebar-logo">
      <a href="index.html">
        <span class="logo-mark" role="img" aria-label="PayHug"></span>
        <span class="wordmark">PayHug <em>Admin</em></span>

    <nav class="sidebar-nav">
      <div class="nav-group" data-group="invest">

        </a>
        <a class="nav-item" data-menu="invest-returns" href="invest-profit.html">

      <div class="nav-group" data-group="merchant">
        <div class="nav-group-label">
          <span>가맹점</span>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>

        </a>
        <a class="nav-item" data-menu="receivables" href="acquisition.html">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          <span>정산채권 양수</span>
        </a>
        <a class="nav-item" data-menu="contracts" href="contracts.html">

          <span>계약기록</span>
        </a>
      </div>

      <div class="nav-group" data-group="manage">
        <div class="nav-group-label">
          <span>관리</span>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
        </div>
        <a class="nav-item" data-menu="kcoon" href="coocon.html">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>

        <a class="nav-item" data-menu="password" href="password.html">

        </a>
      </div>
    </nav>

    <div class="sidebar-profile">
      <div class="avatar">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      </div>
      <div class="info">
        <p class="name">㈜테스트인베스트</p>
        <button class="logout">로그아웃</button>
      </div>
    </div>
  </aside>

  <!-- ═══════════ 콘텐츠 영역 ═══════════ -->
  <main class="content">
    <div class="page-header">
      <h1 class="page-title">가맹점 <span class="state-flag">검색 적용</span></h1>
    </div>

    <!-- 검색 필터 — 조건 입력·적용 상태 -->
    <div class="search-bar">
      <div class="filter-row">
        <div class="filter-field">
          <label>업종</label>
          <select class="input" style="width:140px"><option>전체</option><option selected>음식점업</option></select>
        </div>
        <div class="filter-field">
          <label>채권매입업체</label>
          <select class="input" style="width:180px"><option>전체</option><option>A-001 ㈜페이허그</option></select>
        </div>
        <div class="filter-field" style="flex:1; max-width:360px">
          <label>검색어</label>
          <span class="input" style="width:100%;display:inline-flex;align-items:center;box-sizing:border-box;width:360px;height:38px;white-space:nowrap;overflow:hidden;" data-fig-input="text">곱창</span>
        </div>
        <button class="btn btn-primary">검색</button>
        <button class="btn btn-outline">초기화</button>
      </div>
    </div>

    <!-- 적용된 조건 -->
    <div class="chip-row">
      <span class="chip-label">적용된 조건</span>
      <span class="chip">업종: 음식점업 <button aria-label="조건 해제"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg></button></span>
      <span class="chip">검색어: 곱창 <button aria-label="조건 해제"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg></button></span>
      <button class="chip-clear">조건 초기화</button>
    </div>

    <!-- 조건 일치 목록 -->
    <div class="tbl-wrap">
      <div class="tbl-scroll">
        <table class="tbl">
          <thead>
            <tr>
              <th class="no">No</th>
              <th>가맹점ID</th>
              <th>가맹점명</th>
              <th>사업자번호</th>
              <th>대표자</th>
              <th>업종</th>
              <th>종목</th>
              <th>채권매입업체ID</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="no">1</td>
              <td class="mono">M2026-0002</td>
              <td><span class="name">달빛곱창 홍대점</span></td>
              <td class="mono">234-56-78901</td>
              <td>이달빛</td>
              <td>음식점업</td>
              <td>곱창</td>
              <td><span class="badge sm badge-primary">A-001</span> ㈜페이허그</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="pagination with-count">
        <span class="pg-count">총 <b class="mono">1</b>건</span>
        <span></span>
        <label class="pg-size">보기<select class="input sz" aria-label="보기 갯수"><option value="10" selected>10개</option><option value="20">20개</option><option value="50">50개</option></select></label>
      </div>
    </div>

  </main>

</div>

</html>
