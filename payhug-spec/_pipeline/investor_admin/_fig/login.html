<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>PayHug Admin — 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
  /* 화면 전용 — 색은 base.css 변수만 사용. 사이드바 없는 독립 화면 */
  .login-wrap {
    min-height: 100vh; background: var(--gray-50);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 16px;
  }
  .login-card { width: 100%; max-width: 400px; padding: 36px 32px 28px; }
  .login-logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
  .login-logo .logo-mark { display: block; width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0; }
  .login-logo .wordmark {
    font-size: 22px; line-height: 30px; font-weight: 700;
    color: var(--gray-900); white-space: nowrap;
  }
  .login-logo .wordmark em { font-style: normal; color: var(--primary-600); }
  .login-sub { text-align: center; font-size: 13px; line-height: 20px; color: var(--secondary); margin: 0 0 28px; }
  .login-field { margin-bottom: 16px; }
  .login-field label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; }
  .login-field .input { width: 100%; padding: 11px 16px; border-radius: 12px; background: #fff; border-color: var(--gray-300); }
  .login-submit { width: 100%; padding: 12px 0; border-radius: 12px; margin-top: 8px; }
  .login-links { text-align: center; margin-top: 16px; }
  .login-links a { font-size: 12px; line-height: 16px; color: var(--gray-500); text-decoration: none; }
  .login-links a:hover { color: var(--gray-700); text-decoration: underline; }
  .login-links .link-off { font-size: 12px; line-height: 16px; color: var(--gray-300); text-decoration: none; cursor: not-allowed; }
</style>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=block" rel="stylesheet">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body>

<div class="login-wrap">

  <div class="card login-card">
    <div class="login-logo">
      <span class="logo-mark" role="img" aria-label="PayHug"></span>
      <span class="wordmark">PayHug <em>Admin</em></span>
    </div>
    <p class="login-sub">투자자 어드민</p>

    <div class="login-field">
      <label>사업자등록번호 또는 휴대전화번호</label>
      <input type="text" class="input" data-login="id" placeholder="'-' 없이 숫자만 입력">
    </div>
    <div class="login-field" style="margin-bottom:8px">
      <label>비밀번호</label>
      <input type="password" class="input" data-login="pw" placeholder="비밀번호 입력">
    </div>

    <a class="btn btn-primary login-submit" href="invest-assets.html">로그인</a>

    <div class="login-links">
      <span class="link-off" aria-disabled="true">비밀번호 찾기</span>
    </div>

  </div>

</div>

<script>
/* Enter 제출 — 원본 payhug-admin-web/app/login/page.tsx:88-92 (onKeyDown Enter -> handleLogin).
   원본에도 <form> 은 없다. 입력의 keydown 에서 제출 요소를 그대로 누른다. */
document.addEventListener('keydown', function(e){
  var t = e.target;
  if(e.key !== 'Enter' || !t || !t.getAttribute || !t.getAttribute('data-login')) return;
  e.preventDefault();
  var b = document.querySelector('.login-submit');
  if(b) b.click();
});
</script>

</body>
</html>
