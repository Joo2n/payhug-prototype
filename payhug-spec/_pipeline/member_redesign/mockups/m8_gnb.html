<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>메뉴 구성 — 관리자·총판 시점</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#111827;background:#f9fafb}
.app{display:flex;min-height:1080px;width:1920px}
/* ── sidebar ─────────────────────────── */
.sidebar{width:240px;flex-shrink:0;background:#1B2537;color:#fff;display:flex;flex-direction:column}
.sb-logo{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-mark{width:32px;height:32px;border-radius:8px;background:#7FE141;color:#163300;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sb-logo-text{font-size:18px;font-weight:700}
.sb-logo-text em{font-style:normal;color:#7FE141}
.sb-nav{flex:1;padding:16px 12px}
.sb-item{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;color:#9ca3af;font-size:14px;font-weight:500;white-space:nowrap}
.sb-item svg{width:16px;height:16px;flex-shrink:0}
.sb-item.active{background:#7FE141;color:#fff}
.sb-home{padding:10px 12px;margin-bottom:12px}
.sb-group{margin-top:16px}
.sb-group-label{display:flex;align-items:center;justify-content:space-between;padding:2px 12px;margin-bottom:4px;color:#6b7280;font-size:11px;font-weight:600;letter-spacing:.06em}
.sb-group-label svg{width:12px;height:12px}
.sb-items{display:flex;flex-direction:column;gap:2px}
.sb-collapse{margin:0 12px 8px;padding:8px;border-radius:8px;color:#6b7280}
.sb-collapse svg{width:20px;height:20px}
.sb-user{border-top:1px solid rgba(255,255,255,.1);padding:12px;display:flex;align-items:center;gap:12px}
.sb-avatar{width:36px;height:36px;border-radius:999px;background:rgba(127,225,65,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-avatar svg{width:16px;height:16px;color:#7FE141}
.sb-user-name{font-size:14px;font-weight:500}
.sb-logout{font-size:12px;color:#6b7280}
/* ── placeholder main ────────────────── */
.main{flex:1;min-width:0;padding:24px}
.page-title{font-size:24px;font-weight:700;color:#111827}
.page-sub{margin-top:4px;font-size:14px;color:#6b7280;margin-bottom:24px}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.stat{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.bar{height:12px;border-radius:6px;background:#f3f4f6}
.bar.w40{width:40%}
.bar.w60{width:60%}
.bar.w80{width:80%}
.bar.tall{height:24px}
.big{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:420px}
</style>
</head>
<body>
<div class="app">

  <!-- 관리자 시점 사이드바 -->
  <aside class="sidebar">
    <div class="sb-logo"><div class="sb-mark">P</div><div class="sb-logo-text">PayHug <em>Admin</em></div></div>
    <nav class="sb-nav">
      <a class="sb-item sb-home active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>홈</span></a>
      <div class="sb-group">
        <div class="sb-group-label"><span>가맹점</span><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg></div>
        <div class="sb-items">
          <a class="sb-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg><span>가맹점 관리</span></a>
          <a class="sb-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg><span>매출 조회</span></a>
          <a class="sb-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg><span>1:1 문의</span></a>
        </div>
      </div>
      <div class="sb-group">
        <div class="sb-group-label"><span>정산</span><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg></div>
        <div class="sb-items">
          <a class="sb-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg><span>정산 현황</span></a>
          <a class="sb-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15.75 15.75V18m-7.5-6.75h.008v.008H8.25v-.008zm0 2.25h.008v.008H8.25V13.5zm0 2.25h.008v.008H8.25v-.008zm0 2.25h.008v.008H8.25V18zm2.498-6.75h.007v.008h-.007v-.008zm0 2.25h.007v.008h-.007V13.5zm0 2.25h.007v.008h-.007v-.008zm0 2.25h.007v.008h-.007V18zm2.504-6.75h.008v.008h-.008v-.008zm0 2.25h.008v.008h-.008V13.5zm3.75-6.75A2.25 2.25 0 0119.5 4.5h-15A2.25 2.25 0 002.25 6.75v10.5A2.25 2.25 0 004.5 19.5h15a2.25 2.25 0 002.25-2.25V6.75z"/></svg><span>정산 시뮬레이션</span></a>
        </div>
      </div>
      <div class="sb-group">
        <div class="sb-group-label"><span>관리자</span><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg></div>
        <div class="sb-items">
          <a class="sb-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 10h18M7 15h1m4 0h1m-7 4h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg><span>모 계좌 잔액 조회</span></a>
          <a class="sb-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg><span>회원 관리</span></a>
          <a class="sb-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><span>약관 관리</span></a>
          <a class="sb-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 9v2m0 4h.01M5.07 19h13.86c1.54 0 2.5-1.67 1.73-3L13.73 4a2 2 0 00-3.46 0L3.34 16c-.77 1.33.19 3 1.73 3z"/></svg><span>스크래핑 장애 이력</span></a>
          <a class="sb-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span>활동 로그</span></a>
          <a class="sb-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><span>AI 모니터링 어시스턴트</span></a>
        </div>
      </div>
    </nav>
    <div class="sb-collapse"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg></div>
    <div class="sb-user">
      <div class="sb-avatar"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></div>
      <div><div class="sb-user-name">관리자</div><div class="sb-logout">로그아웃</div></div>
    </div>
  </aside>

  <!-- 빈 대시보드 플레이스홀더 -->
  <main class="main">
    <h1 class="page-title">홈</h1>
    <p class="page-sub">대시보드</p>
    <div class="stat-row">
      <div class="stat"><span class="bar w40"></span><span class="bar tall w60"></span></div>
      <div class="stat"><span class="bar w40"></span><span class="bar tall w60"></span></div>
      <div class="stat"><span class="bar w40"></span><span class="bar tall w60"></span></div>
    </div>
    <div class="big">
      <span class="bar w40"></span>
      <span class="bar w80"></span>
      <span class="bar w60"></span>
      <span class="bar w80"></span>
      <span class="bar w60"></span>
      <span class="bar w40"></span>
    </div>
  </main>

  <!-- 총판(참여자) 시점 사이드바 -->
  <aside class="sidebar">
    <div class="sb-logo"><div class="sb-mark">P</div><div class="sb-logo-text">PayHug <em>Admin</em></div></div>
    <nav class="sb-nav">
      <a class="sb-item sb-home active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>홈</span></a>
      <div class="sb-group">
        <div class="sb-group-label"><span>가맹점</span><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg></div>
        <div class="sb-items">
          <a class="sb-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg><span>가맹점 관리</span></a>
          <a class="sb-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg><span>매출 조회</span></a>
        </div>
      </div>
      <div class="sb-group">
        <div class="sb-group-label"><span>정산</span><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg></div>
        <div class="sb-items">
          <a class="sb-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg><span>정산 현황</span></a>
        </div>
      </div>
      <div class="sb-group">
        <div class="sb-group-label"><span>관리</span><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg></div>
        <div class="sb-items">
          <a class="sb-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg><span>회원 관리</span></a>
        </div>
      </div>
    </nav>
    <div class="sb-collapse"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg></div>
    <div class="sb-user">
      <div class="sb-avatar"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></div>
      <div><div class="sb-user-name">A파트너</div><div class="sb-logout">로그아웃</div></div>
    </div>
  </aside>

</div>
</body>
</html>
